<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Appka – checkpoint Cíl</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0b6bcb}a:hover{color:#08529c}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f4f6f8; color: #16202a; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative; font-variant-numeric: tabular-nums">
  <div style="height: 56px; flex: none; background: #ffffff; border-bottom: 1px solid #d5dbe1; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 4px">
    <button aria-label="Zpět" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #16202a">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
      <strong style="font-size: 17px">Cíl</strong>
      <span style="font-size: 12px; color: #5f6b76">Vlkančický triatlon 2027</span>
    </div>
    <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #1a7f37; background: #e3f4e8; padding: 5px 10px; border-radius: 999px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #1a7f37"></span>Online · 0</span>
  </div>

  <div style="padding: 10px 16px 0; display: flex; flex-direction: column; gap: 10px; flex: none">
    <div role="group" aria-label="Režim" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #e6e9ec; border-radius: 10px; padding: 3px">
      <button style="border: 0; border-radius: 8px; padding: 8px 0; font: inherit; font-size: 13px; font-weight: 700; background: #ffffff; color: #16202a">Záznam</button>
      <button style="border: 0; border-radius: 8px; padding: 8px 0; font: inherit; font-size: 13px; background: transparent; color: #4a5560">Start</button>
      <button style="border: 0; border-radius: 8px; padding: 8px 0; font: inherit; font-size: 13px; background: transparent; color: #4a5560">Check-in</button>
      <button style="border: 0; border-radius: 8px; padding: 8px 0; font: inherit; font-size: 13px; background: transparent; color: #4a5560">Registrace</button>
    </div>
    <div style="display: flex; gap: 8px">
      <label style="flex: 1; display: flex; align-items: center; gap: 8px; background: #ffffff; border: 1px solid #d5dbe1; border-radius: 10px; padding: 0 12px; height: 44px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5f6b76" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input placeholder="Hledat číslo" inputmode="numeric" aria-label="Hledat číslo" style="border: 0; outline: none; font: inherit; font-size: 15px; flex: 1; min-width: 0; background: transparent">
      </label>
      <button style="height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #0b6bcb; background: #ffffff; color: #0b6bcb; font: inherit; font-size: 14px; font-weight: 600">Jen čekající</button>
    </div>
    <div style="display: flex; gap: 6px; overflow: hidden">
      <span style="flex: none; padding: 6px 12px; border-radius: 999px; background: #16202a; color: #ffffff; font-size: 13px; font-weight: 600">Vše</span>
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
        <span style="{{c.style}}">{{c.label}}</span>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: #5f6b76"><span>Zaznamenáno <strong style="color: #16202a">{{doneCount}} z {{total}}</strong></span><span>3 nepřítomní skryti</span></div>
      <div style="display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: #dfe3e8">
        <sc-for list="{{progress}}" as="p" hint-placeholder-count="4"><span style="{{p.style}}"></span></sc-for>
      </div>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 12px 16px 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 70px; gap: 8px">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="24">
      <button onClick="{{t.pick}}" aria-label="{{t.aria}}" style="{{t.style}}">
        <span style="{{t.stripe}}"></span>
        <span style="{{t.numStyle}}">{{t.bib}}</span>
        <span style="font-size: 11px; font-weight: 600; color: #4a5560">{{t.sub}}</span>
      </button>
    </sc-for>
  </div>

  <sc-if value="{{hasLast}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; left: 12px; right: 12px; bottom: 16px; background: #16202a; color: #ffffff; border-radius: 12px; padding: 0 6px 0 16px; height: 56px; display: flex; align-items: center; gap: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.25)">
      <span style="{{lastDot}}"></span>
      <span style="flex: 1; font-size: 14px">Č. <strong>{{lastBib}}</strong> ({{lastCat}}) · {{lastTime}}</span>
      <button onClick="{{undo}}" style="height: 44px; padding: 0 14px; border: 0; border-radius: 8px; background: transparent; color: #8cc4ff; font: inherit; font-size: 14px; font-weight: 700">Vrátit</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      done: { 'm12': '11:01:52', 'm7': '11:02:09', 'm3': '11:02:46', 'z31': '11:00:12', 'n8': '10:58:41', 'n3': '10:58:41', 'z7': '11:01:30' },
      last: 'm3'
    };
  }
  renderVals() {
    var self = this;
    var cat = {
      m: ['M do 40', '#0b6bcb'], z: ['Ženy', '#c2185b'], n: ['M nad 40', '#2e7d32'], s: ['Super Ž', '#ef6c00']
    };
    var list = [['m', 12], ['m', 7], ['m', 3], ['m', 21], ['m', 15], ['m', 9], ['m', 2], ['m', 25], ['z', 31], ['z', 7], ['z', 14], ['z', 22], ['z', 5], ['z', 18], ['z', 11], ['z', 3], ['n', 8], ['n', 3], ['n', 16], ['n', 10], ['s', 41], ['s', 44], ['s', 7], ['s', 49]];
    var done = this.state.done;
    var now = function () { var d = new Date(); return [d.getHours(), d.getMinutes(), d.getSeconds()].map(function (n) { return String(n).padStart(2, '0'); }).join(':'); };
    var tiles = list.map(function (e) {
      var id = e[0] + e[1], c = cat[e[0]], t = done[id];
      return {
        bib: e[1],
        sub: t ? t : c[0],
        aria: 'Číslo ' + e[1] + ', ' + c[0] + (t ? ', zaznamenáno ' + t : ''),
        style: 'position:relative;overflow:hidden;border-radius:10px;border:1px solid ' + (t ? '#d5dbe1' : c[1]) + ';background:' + (t ? '#e6e9ec' : '#ffffff') + ';display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 0 0;font:inherit;cursor:pointer',
        stripe: 'position:absolute;left:0;right:0;top:0;height:5px;background:' + (t ? '#b9c1c9' : c[1]),
        numStyle: 'font-size:26px;font-weight:800;line-height:1;color:' + (t ? '#8a95a0' : '#16202a') + (t ? ';text-decoration:line-through' : ''),
        pick: function () {
          if (done[id]) return;
          var n = Object.assign({}, done); n[id] = now();
          self.setState({ done: n, last: id });
        }
      };
    });
    var keys = Object.keys(done);
    var progress = ['m', 'z', 'n', 's'].map(function (k) {
      var n = keys.filter(function (x) { return x[0] === k; }).length;
      return { style: 'width:' + (n / list.length * 100).toFixed(1) + '%;background:' + cat[k][1] };
    });
    var cats = ['m', 'z', 'n', 's'].map(function (k) { return { label: cat[k][0], style: 'flex:none;padding:5px 12px;border-radius:999px;background:#ffffff;border:1.5px solid ' + cat[k][1] + ';font-size:13px;font-weight:600;color:#16202a' }; });
    var last = this.state.last;
    return {
      tiles: tiles, cats: cats, progress: progress,
      doneCount: keys.length, total: list.length,
      hasLast: !!last && !!done[last],
      lastBib: last ? last.slice(1) : '',
      lastCat: last ? cat[last[0]][0] : '',
      lastTime: last && done[last] ? done[last] : '',
      lastDot: 'width:10px;height:10px;border-radius:50%;flex:none;background:' + (last ? cat[last[0]][1] : '#ffffff'),
      undo: function () {
        if (!last) return;
        var n = Object.assign({}, done); delete n[last];
        self.setState({ done: n, last: null });
      }
    };
  }
}
</script>
</body>
</html>
