name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: triatlon
          POSTGRES_PASSWORD: triatlon
          POSTGRES_DB: triatlon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triatlon" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://triatlon:triatlon@localhost:5432/triatlon
      AUTH_SECRET: ci-secret-0123456789-0123456789-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm --filter @triatlon/api exec prisma migrate deploy
      - run: pnpm test
