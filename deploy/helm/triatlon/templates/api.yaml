{{- $name := printf "%s-api" (include "triatlon.fullname" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "triatlon.labels" . | nindent 4 }}
spec:
  selector: {{- include "triatlon.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "triatlon.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {{- include "triatlon.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "triatlon.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.postgres.enabled }}
      # Migrace při startu API potřebují databázi — počkat, až Postgres přijímá spojení.
      initContainers:
        - name: wait-for-db
          image: {{ .Values.postgres.image }}
          command:
            - sh
            - -c
            - until pg_isready -h {{ include "triatlon.fullname" . }}-postgres -p 5432; do sleep 2; done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      {{- end }}
      containers:
        - name: api
          image: {{ include "triatlon.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "triatlon.dbEnv" . | nindent 12 }}
            - name: API_PORT
              value: '3000'
            - name: WEB_URL
              value: {{ include "triatlon.webUrl" . | quote }}
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef: { name: {{ include "triatlon.secret" . }}, key: AUTH_SECRET }
            - name: SMTP_USER
              valueFrom:
                secretKeyRef: { name: {{ include "triatlon.secret" . }}, key: SMTP_USER, optional: true }
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "triatlon.secret" . }}, key: SMTP_PASSWORD, optional: true }
            {{- if .Values.mailpit.enabled }}
            - name: SMTP_HOST
              value: {{ include "triatlon.fullname" . }}-mailpit
            - name: SMTP_PORT
              value: '1025'
            {{- end }}
            {{- range $k, $v := .Values.api.env }}
            {{- if not (and $.Values.mailpit.enabled (has $k (list "SMTP_HOST" "SMTP_PORT"))) }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
          ports:
            - containerPort: 3000
          # Migrace databáze běží při startu kontejneru → delší start.
          startupProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 20
            failureThreshold: 6
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
