services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: triatlon
      POSTGRES_PASSWORD: triatlon
      POSTGRES_DB: triatlon
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U triatlon']
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI pro zachycené e-maily

volumes:
  pgdata:
