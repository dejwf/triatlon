# Jednoduchá registry image uvnitř clusteru (pro cluster bez vlastní registry, např. microk8s
# v homelabu). Image se do ní posílají z vývojového počítače přes NodePort 32000 (HTTP bez TLS,
# jen pro domácí síť) a pody je tahají z `localhost:32000` — microk8s má tuto adresu v containerd
# povolenou bez TLS už ve výchozí konfiguraci. Postup viz deploy/k8s/README.md.
#   kubectl apply -f deploy/k8s/registry.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: registry
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: registry }
  template:
    metadata:
      labels: { app: registry }
    spec:
      containers:
        - name: registry
          image: registry:2.8.3
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: 'true'
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          readinessProbe:
            httpGet: { path: /v2/, port: 5000 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  type: NodePort
  selector: { app: registry }
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 32000
